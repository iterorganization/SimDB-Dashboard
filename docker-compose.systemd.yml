# Systemd override for docker-compose.yml.
#
# Uses the GHCR-published image instead of a local build.
#
# Set SIMDB_DASHBOARD_TAG in the environment file to pin a specific
# version. The default is the latest tag.
#
# Published tags (ghcr.io/iterorganization/simdb-dashboard):
#   <version>  immutable per-commit build, pin for reproducibility (e.g. 0.9.0)
#   latest     most recently pushed tag (default; moves after any tag push)
#   develop    tip of develop, for (pre-production) testing only
# See docs/installation.md#published-image-tags-ghcr.
#
# Enable this override by including it in COMPOSE_FILE,
# after the original, e.g.
#   COMPOSE_FILE="docker-compose.yml:docker-compose.https.yml"
#   COMPOSE_FILE="docker-compose.yml:docker-compose.https.yml:docker-compose.systemd.yml"
#
services:
  dashboard:
    # Systemd deployment should only manage a single container instance, docker requires
    # container_name to be unique, so use it to ensure a fixed name and no flexible per-port naming.
    container_name: ${SYSTEMD_CONTAINER_NAME:-simdb-dashboard-systemd}
    image: ${SIMDB_DASHBOARD_IMAGE:-ghcr.io/iterorganization/simdb-dashboard}:${SIMDB_DASHBOARD_TAG:-latest}
    logging:
      driver: journald
      options:
        tag: simdb-dashboard